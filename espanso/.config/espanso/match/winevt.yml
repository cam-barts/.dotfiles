# ;;evt   -> labelled picker of event IDs (also findable via the ;;; search bar)
# ;;xq.*  -> QueryList / XPath builders for Event Viewer "Edit query manually"
# Linux-side expansion only; inside an RDP session the CTRL+SHIFT+V paste won't work.

