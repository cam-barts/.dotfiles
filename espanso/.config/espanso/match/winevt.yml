  # --- XML query builders ---------------------------------------------------
  # Defender events live in "Microsoft-Windows-Windows Defender/Operational".

  # Event IDs, comma separated -> EventID=a or EventID=b
  - trigger: ";;xq.id"
    replace: |
      <QueryList>
        <Query Id="0">
          <Select Path="{{form1.log}}">*[System[({{idexpr}})]]</Select>
        </Query>
      </QueryList>
    vars:
      - name: form1
        type: form
        params:
          layout: |
            Log [[log]]
            Event IDs (comma separated) [[ids]]
          fields:
            log: &logfield
              type: choice
              default: Security
              values:
                - Security
                - System
                - Application
                - Microsoft-Windows-Windows Defender/Operational
            ids:
              default: "4624"
      - name: idexpr
        type: shell
        params:
          cmd: 'printf %s "$ESPANSO_FORM1_IDS" | tr -cd "0-9," | sed -e "s/,,*/,/g; s/^,//; s/,$//; s/,/ or EventID=/g; s/^/EventID=/"'

  # Named EventData field = value (module default: SubjectLogonId=0x3E7)
  - trigger: ";;xq.data"
    replace: |
      <QueryList>
        <Query Id="0">
          <Select Path="{{form1.log}}">*[EventData[Data[@Name='{{form1.field}}']='{{form1.value}}']]</Select>
        </Query>
      </QueryList>
    vars:
      - name: form1
        type: form
        params:
          layout: |
            Log [[log]]
            Field [[field]] = [[value]]
          fields:
            log: *logfield
            field:
              default: SubjectLogonId
            value:
              default: "0x3E7"

  # EventData field = value AND a specific event ID
  - trigger: ";;xq.dataid"
    replace: |
      <QueryList>
        <Query Id="0">
          <Select Path="{{form1.log}}">
            *[EventData[Data[@Name='{{form1.field}}']='{{form1.value}}']]
            and
            *[System[(EventID='{{form1.id}}')]]
          </Select>
        </Query>
      </QueryList>
    vars:
      - name: form1
        type: form
        params:
          layout: |
            Log [[log]]  Event ID [[id]]
            Field [[field]] = [[value]]
          fields:
            log: *logfield
            id:
              default: "4624"
            field:
              default: SubjectUserName
            value:
              default: ""

  # Any EventData field equals value (don't know which field holds it)
  - trigger: ";;xq.any"
    replace: |
      <QueryList>
        <Query Id="0">
          <Select Path="{{form1.log}}">*[EventData[Data and (Data='{{form1.value}}')]]</Select>
        </Query>
      </QueryList>
    vars:
      - name: form1
        type: form
        params:
          layout: |
            Log [[log]]
            Any Data = [[value]]
          fields:
            log: *logfield
            value:
              default: ""

  # Events from the last N hours (timediff is in ms)
  - trigger: ";;xq.time"
    replace: |
      <QueryList>
        <Query Id="0">
          <Select Path="{{form1.log}}">*[System[TimeCreated[timediff(@SystemTime) &lt;= {{ms}}]]]</Select>
        </Query>
      </QueryList>
    vars:
      - name: form1
        type: form
        params:
          layout: |
            Log [[log]]
            Last N hours [[hours]]
          fields:
            log: *logfield
            hours:
              default: "24"
      - name: ms
        type: shell
        params:
          cmd: 'h=$(printf %s "$ESPANSO_FORM1_HOURS" | tr -cd "0-9"); echo $(( ${h:-24} * 3600000 ))'

  # PowerShell equivalent
  - trigger: ";;xq.ps"
    replace: "Get-WinEvent -LogName '{{form1.log}}' -FilterXPath \"{{form1.xpath}}\""
    vars:
      - name: form1
        type: form
        params:
          layout: |
            Log [[log]]
            XPath [[xpath]]
          fields:
            log: *logfield
            xpath:
              default: "*[System[EventID=4624]]"

  # Syntax cheatsheet
  - trigger: ";;xq.help"
    replace: |
      <!--
        Event Viewer XPath cheatsheet (subset of XPath 1.0)
        Where: Filter Current Log / Create Custom View -> XML -> Edit query manually
        Field names: open an event -> Details -> XML View (<System> and <EventData>)

        By ID:        *[System[(EventID='4624' or EventID='4625')]]
        By field:     *[EventData[Data[@Name='SubjectUserName']='test9']]
        Field OR:     *[EventData[Data[@Name='SubjectUserName'] and (Data='test5' or Data='test9')]]
        Any field:    *[EventData[Data and (Data='test5')]]
        Combine:      <expr> and *[System[(EventID='4663')]]
        Last 24h:     *[System[TimeCreated[timediff(@SystemTime) &lt;= 86400000]]]
        Multi-log:    several <Select Path="..."> in one <Query>
        Supported:    position(), band(), timediff()
        NOT supported: contains(), starts-with()
        Escape < as &lt; inside the query.
      -->
